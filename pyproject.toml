[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heat-cold-spell"
version = "0.1.0"
description = "Heat and cold spell analysis and forecasting library"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "tensorflow",
    "joblib",
    "openpyxl",
    "matplotlib",
    "scipy"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]